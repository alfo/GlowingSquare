; ============================================================
;  Glowing Square 2
;
;  One firmware: the web interface picks what the 64x32 matrix shows
;  (Tube, Flights, Unifi). One env per way of driving the panel; each is
;  its own release asset, web flasher entry and version.json key.
;
;  Built on esp32-iot-template (src/app, src/services, src/web,
;  src/hardware are the template's core, kept in step with
;  tools/sync_template.py). The product lives in src/project/.
; ============================================================

[platformio]
default_envs = gs-mini32-pxmatrix

[env]
; Pinned. pioarduino 55.03.312-1 ships Arduino core 3.3.12 on ESP-IDF 5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_filters = esp32_exception_decoder, time
monitor_speed = 115200
extra_scripts = pre:scripts/pio_env.py
build_flags =
    -Wall
    -Wno-unused-function
; Every dependency pinned.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    fastled/FastLED@3.10.3
    knolleary/PubSubClient@2.8
; The two matrix drivers: each env compiles only its own.
build_src_filter =
    +<*>
    -<project/matrix/matrix_pxmatrix.cpp>
    -<project/matrix/matrix_dma.cpp>

[classic_4mb]
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions/esp32_4mb.csv
build_flags =
    ${env.build_flags}
    -DAPP_SLOT_BYTES=0x1E0000
    -DFLASH_LOG_BYTES=131072

[s3_8mb]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAPP_SLOT_BYTES=0x300000

; ---- The displays as built in 2020 -----------------------------------------
; D1 Mini 32 on Brian Lough's ESP32 Matrix Shield (Mini 32). The shield wires
; only one colour line (R1 on GPIO13, the panel's colour registers chained by
; the short ribbon), so only PxMatrix can drive it.
[env:gs-mini32-pxmatrix]
extends = classic_4mb
custom_flasher_name = D1 Mini 32 + Brian Lough Matrix Shield
custom_flasher_note = The original Glowing Square hardware (PxMatrix driver, P4 64x32 panel).
lib_deps =
    ${env.lib_deps}
    PxMatrix   ; vendored in lib/PxMatrix (core 3 fixes)
build_flags =
    ${classic_4mb.build_flags}
    '-DBOARD_NAME="D1 Mini 32 + Matrix Shield"'
    -DMATRIX_PXMATRIX
build_src_filter =
    ${env.build_src_filter}
    +<project/matrix/matrix_pxmatrix.cpp>

; ---- New builds: all six colour lines wired --------------------------------
; Any classic ESP32 wired to the HUB75 DMA library's default pins, or a board
; made for it (Brian Lough's I2S Matrix Shield, the ESP32 Trinity).
[env:gs-esp32-dma]
extends = classic_4mb
custom_flasher_name = ESP32 + HUB75 (DMA)
custom_flasher_note = Classic ESP32 with all six colour lines wired (I2S Matrix Shield, Trinity, or the library's default pins).
lib_deps =
    ${env.lib_deps}
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
build_flags =
    ${classic_4mb.build_flags}
    '-DBOARD_NAME="ESP32 HUB75"'
    -DMATRIX_DMA
build_src_filter =
    ${env.build_src_filter}
    +<project/matrix/matrix_dma.cpp>

[env:gs-s3-dma]
extends = s3_8mb
custom_flasher_name = ESP32-S3 + HUB75 (DMA)
custom_flasher_note = Any ESP32-S3 with 8 MB flash, HUB75 pins set in the Settings page.
lib_deps =
    ${env.lib_deps}
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
build_flags =
    ${s3_8mb.build_flags}
    '-DBOARD_NAME="ESP32-S3 HUB75"'
    -DMATRIX_DMA
build_src_filter =
    ${env.build_src_filter}
    +<project/matrix/matrix_dma.cpp>
